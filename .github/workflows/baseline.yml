name: Baseline quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked development environment
        working-directory: baseline
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev
      - name: Lint, format, types, and offline tests
        working-directory: baseline
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate benchmark files
        working-directory: baseline
        run: |
          uv run --frozen pmwp-baseline validate-data ../validset.json
          uv run --frozen pmwp-baseline validate-data ../testset.json
