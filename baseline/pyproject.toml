[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pmwp-baseline"
version = "0.1.0"
description = "Auditable inference-only PMWP evaluation through OpenRouter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.11.13", "mypy==1.15.0"]

[project.scripts]
pmwp-baseline = "pmwp_baseline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmwp_baseline"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
